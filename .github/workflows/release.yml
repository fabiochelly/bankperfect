name: Publication

# Un tag « v9.0.0 » construit les binaires et crée la release GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Construction
        run: cargo build --release --locked -p bankperfect
      - name: Archive
        run: |
          # Hors tag (lancement manuel), le nom de branche peut contenir « / ».
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//\//-}"
          DIR="bankperfect-${VERSION}-linux-x86_64"
          mkdir -p "$DIR/icons"
          cp target/release/bankperfect LICENSE README.md "$DIR/"
          cp packaging/linux/bankperfect.desktop packaging/linux/bankperfect-mime.xml packaging/linux/install.sh "$DIR/"
          for s in 16 32 48 64 128 256 512; do cp "crates/bp-app/assets/icon/bankperfect-$s.png" "$DIR/icons/"; done
          cp crates/bp-app/assets/icon/bankperfect.svg "$DIR/icons/"
          strip "$DIR/bankperfect"
          tar czf "$DIR.tar.gz" "$DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: bankperfect-*-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Construction
        run: cargo build --release --locked -p bankperfect
      # Signature Authenticode par SignPath Foundation (voir CODE_SIGNING.md) :
      # un exécutable non signé est bloqué par Defender lors de la validation
      # winget. SignPath récupère l'artefact, attend l'approbation manuelle de
      # la release puis renvoie l'exécutable signé.
      - name: Exécutable à signer
        id: unsigned
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: target/release/bankperfect.exe
      - name: Signature (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: bankperfect
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signed
      - name: Vérification de la signature
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature target/signed/bankperfect.exe
          if ($sig.Status -ne "Valid") { throw "signature invalide : $($sig.Status) $($sig.StatusMessage)" }
          Write-Host "Signé par $($sig.SignerCertificate.Subject)"
          Copy-Item target/signed/bankperfect.exe target/release/bankperfect.exe -Force
      - name: Avertissement (exécutable non signé)
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID == ''
        run: echo "::warning::SIGNPATH_ORGANIZATION_ID non défini, bankperfect.exe n'est pas signé et sera bloqué par la validation winget"
      - name: Archive
        shell: pwsh
        run: |
          # Hors tag (lancement manuel), le nom de branche peut contenir « / ».
          $version = "$env:GITHUB_REF_NAME".TrimStart("v").Replace("/", "-")
          $dir = "bankperfect-$version-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/bankperfect.exe, LICENSE, README.md $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: bankperfect-*-windows-x86_64.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Construction (Apple Silicon et Intel)
        run: |
          cargo build --release --locked -p bankperfect --target aarch64-apple-darwin
          cargo build --release --locked -p bankperfect --target x86_64-apple-darwin
      - name: Application universelle
        run: |
          # Hors tag (lancement manuel), le nom de branche peut contenir « / ».
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//\//-}"
          APP="BankPerfect.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/bankperfect" \
            target/aarch64-apple-darwin/release/bankperfect \
            target/x86_64-apple-darwin/release/bankperfect
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          ICONSET=bankperfect.iconset
          mkdir "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s crates/bp-app/assets/icon/bankperfect-512.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d crates/bp-app/assets/icon/bankperfect-512.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/bankperfect.icns"
          # Signature ad hoc : nécessaire pour lancer un binaire arm64.
          codesign --force --deep --sign - "$APP"
          # Signature cassée = « endommagé » au lancement, sans recours.
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "BankPerfect-${VERSION}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: BankPerfect-*-macos-universal.zip

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Sommes de contrôle
        run: sha256sum bankperfect-* BankPerfect-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: BankPerfect ${{ github.ref_name }}
          # Mention exigée par SignPath quand l'exécutable est signé, sinon la
          # marche à suivre si Smart App Control bloque l'exécutable.
          body: |
            ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && '[Politique de signature du code](https://github.com/fabiochelly/bankperfect/blob/main/CODE_SIGNING.md) : Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).' || '**Windows : si BankPerfect ne s''ouvre pas.** BankPerfect 9 est encore trop récent pour être certifié par Microsoft : sous Windows 11, le Contrôle intelligent des applications (Smart App Control) peut bloquer son ouverture, parfois sans aucun message. [Comment le débloquer](https://github.com/fabiochelly/bankperfect#windows--si-bankperfect-ne-souvre-pas) · [How to unblock it](https://github.com/fabiochelly/bankperfect/blob/main/README.en.md#windows-if-bankperfect-does-not-open)' }}

            **macOS : si BankPerfect ne s'ouvre pas.** L'application n'est pas notariée par Apple : [comment l'ouvrir la première fois](https://github.com/fabiochelly/bankperfect#macos--si-bankperfect-ne-souvre-pas) · [How to open it the first time](https://github.com/fabiochelly/bankperfect/blob/main/README.en.md#macos-if-bankperfect-does-not-open)
          generate_release_notes: true
          files: |
            bankperfect-*
            BankPerfect-*
            SHA256SUMS.txt
