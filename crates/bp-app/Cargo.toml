[package]
name = "bankperfect"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

[dependencies]
bp-core = { version = "9.11.1", path = "../bp-core" }
bp-ext = { version = "9.11.1", path = "../bp-ext" }
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.36"
egui-phosphor = "0.14.0"
egui_extras = "0.36.2"
ed25519-dalek = "2.2.0"
encoding_rs = "0.8.42"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
nucleo-matcher = "0.3"
open = "5"
printpdf = "0.7"
rfd = "0.17.2"
rust_xlsxwriter = { version = "0.99", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
trash = "5"
ttf-parser = "0.25"
ureq = "3.4.2"
sys-locale = "0.3.2"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"

[build-dependencies]
winresource = "0.1"
